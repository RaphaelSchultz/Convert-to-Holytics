version: '3.8'

services:
  web:
    build: .
    container_name: convert-to-holytics
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - DEFAULT_DB_PATH=/data/database.db
    volumes:
      - ./musicas_txt_formatadas:/app/musicas_txt_formatadas
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
